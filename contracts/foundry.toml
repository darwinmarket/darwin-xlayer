[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
fs_permissions = [{ access = "read", path = "../circuits/build" }, { access = "read-write", path = "../deployments" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 64
depth = 32

[rpc_endpoints]
xlayer = "https://rpc.xlayer.tech"

[fmt]
line_length = 110
